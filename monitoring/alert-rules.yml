groups:
  - name: infra-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 80% for 5 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 85% for 5 minutes."

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage has been above 90% for 10 minutes."

  - name: app-alerts
    rules:
      - alert: FastAPIServiceDown
        expr: up{job="stackpilot-api"} == 0
        for: 1m
        labels:
          severity: critical
          category: application
        annotations:
          summary: "FastAPI service is down"
          description: "Prometheus cannot scrape stackpilot-api /metrics endpoint."

      - alert: DeploymentFailuresDetected
        expr: stackpilot_deployments_by_status{status="failed"} > 0
        for: 2m
        labels:
          severity: warning
          category: deployment
        annotations:
          summary: "Failed deployment detected"
          description: "{{ $value }} deployment(s) currently in failed state."

      - alert: HighErrorRate
        expr: sum(rate(stackpilot_http_request_errors_total[5m])) / clamp_min(sum(rate(stackpilot_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High API error rate"
          description: "5xx error rate is above 5% for 5 minutes."

  - name: container-alerts
    rules:
      - alert: ContainerCrashLoopDetected
        expr: changes(container_start_time_seconds{id!="/", id!=""}[10m]) > 2
        for: 2m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} restarted multiple times in 10 minutes."
