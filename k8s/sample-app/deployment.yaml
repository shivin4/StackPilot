apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: stackpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: stackpilot-node-hello:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: stackpilot
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
